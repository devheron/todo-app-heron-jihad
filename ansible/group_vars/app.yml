---

# ---- Nginx (porta pública da aplicação) ----
app_http_port: 80 

# ---- API Node.js/Express ----
app_api_port: 5000  

# ---- Docker ----
app_network: todo-net 
app_config_dir: /opt/todo-app 

# ---- Conexão com o banco (VM do banco, pela rede privada) ----
db_private_ip: "{{ hostvars[groups['db'][0]]['ansible_default_ipv4']['address'] }}"
db_port: "{{ hostvars[groups['db'][0]]['mongo_port'] }}"   # mesma porta definida no db.yml