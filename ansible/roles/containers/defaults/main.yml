---
# Valores padrão da role containers.

# docker_image = prefixo das imagens; docker_tag = versão (parâmetros da pipeline)
docker_image: ghcr.io/devheron/todo-app-heron-jihad
docker_tag: v1
force_pull: false 
app_backend_image: "{{ docker_image }}-backend"
app_frontend_image: "{{ docker_image }}-frontend"

# Login no registry (credenciais vêm da pipeline por variável de ambiente)
registry_url: ghcr.io
registry_username: "{{ lookup('ansible.builtin.env', 'REGISTRY_USERNAME') }}"
registry_password: "{{ lookup('ansible.builtin.env', 'REGISTRY_PASSWORD') }}"

# Docker na VM da aplicação 
app_network: todo-net
app_config_dir: /opt/todo-app
app_http_port: 80
app_api_port: 5000

# Conexão da API com o MongoDB (VM do banco, pela rede privada)
mongo_database: todo-app
mongo_app_user: todoapp
mongo_app_password: "{{ lookup('ansible.builtin.env', 'MONGO_APP_PASSWORD') }}"
db_private_ip: "{{ hostvars[groups['db'][0]]['ansible_default_ipv4']['address'] }}"
db_port: 27017

mongo_app_password_url: "{{ mongo_app_password | urlencode | replace('/', '%2F') }}"
mongo_uri: >-
  mongodb://{{ mongo_app_user }}:{{ mongo_app_password_url }}@{{ db_private_ip }}:{{ db_port }}/{{ mongo_database }}?authSource={{ mongo_database }}

mongo_image: mongo
mongo_tag: "7.0"
mongo_port: 27017
mongo_bind_ip: "{{ ansible_default_ipv4.address }}"
mongo_root_user: "{{ lookup('ansible.builtin.env', 'MONGO_ROOT_USERNAME') | default('admin', true) }}"
mongo_root_password: "{{ lookup('ansible.builtin.env', 'MONGO_ROOT_PASSWORD') }}"
mongo_volume: todo-mongo-data
db_config_dir: /opt/todo-db
# Caddy serve HTTPS na porta 443 e redireciona HTTP para HTTPS automaticamente
# Pede o certificado TLS no Let's Encrypt via desafio HTTP-01 usando nip.io
# (nip.io resolve qualquer IP como subdominio, sem precisar registrar dominio)
caddy_image: caddy
caddy_tag: "2.8"
caddy_config_dir: /opt/todo-caddy
caddy_data_volume: todo-caddy-data
caddy_https_port: 443
caddy_domain: "{{ hostvars[groups['app'][0]]['ansible_host'] }}.nip.io"
tls_email: "devheron.contact@gmail.com"
