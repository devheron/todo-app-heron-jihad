---
# Role containers
# Cria e mantém os contêineres de cada VM:
#   VM da aplicação -> app.yml (Nginx + frontend React e API Node.js)
#   VM do banco     -> db.yml  (MongoDB) — card 18

- name: Configurar contêineres da VM da aplicação
  ansible.builtin.include_tasks: app.yml
  when: "'app' in group_names"