---

- name: Validar que a senha do banco foi informada pela pipeline
  ansible.builtin.assert:
    that: mongo_app_password | length > 0
    fail_msg: "MONGO_APP_PASSWORD não informada. Configure o GitHub Secret e passe para o Ansible."
    quiet: true

- name: Criar diretório de configuração da aplicação
  ansible.builtin.file:
    path: "{{ app_config_dir }}"
    state: directory
    mode: "0755"

- name: Gerar configuração do Nginx (proxy reverso /todos -> API)
  ansible.builtin.template:
    src: nginx-todo.conf.j2
    dest: "{{ app_config_dir }}/nginx.conf"
    mode: "0644"
  register: app_nginx_conf

- name: Criar rede Docker interna da aplicação
  community.docker.docker_network:
    name: "{{ app_network }}"

- name: Autenticar no registry de imagens (GitHub Container Registry)
  community.docker.docker_login:
    registry_url: "{{ registry_url }}"
    username: "{{ registry_username }}"
    password: "{{ registry_password }}"
  when: registry_password | length > 0
  no_log: true

- name: Baixar imagens da aplicação (tag {{ docker_tag }})
  community.docker.docker_image_pull:
    name: "{{ item }}"
    tag: "{{ docker_tag }}"
    pull: "{{ 'always' if force_pull | bool else 'not_present' }}"
  loop:
    - "{{ app_backend_image }}"
    - "{{ app_frontend_image }}"

- name: Criar/atualizar contêiner da API (todo-backend)
  community.docker.docker_container:
    name: todo-backend
    image: "{{ app_backend_image }}:{{ docker_tag }}"
    state: started
    restart_policy: always
    networks:
      - name: "{{ app_network }}"
    env:
      MONGO_URI: "{{ mongo_uri }}"
  no_log: true

- name: Criar/atualizar contêiner do frontend + Nginx (todo-frontend)
  community.docker.docker_container:
    name: todo-frontend
    image: "{{ app_frontend_image }}:{{ docker_tag }}"
    state: started
    restart_policy: always
    restart: "{{ app_nginx_conf.changed }}"
    published_ports: []
    networks:
      - name: "{{ app_network }}"
    volumes:
      - "{{ app_config_dir }}/nginx.conf:/etc/nginx/conf.d/default.conf:ro"

- name: Criar diretorio de configuracao do Caddy
  ansible.builtin.file:
    path: "{{ caddy_config_dir }}"
    state: directory
    mode: "0755"

- name: Gerar Caddyfile (reverse proxy do Caddy para o frontend)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_config_dir }}/Caddyfile"
    mode: "0644"
  register: caddy_conf

- name: Criar/atualizar container do Caddy (HTTPS automatico via Let's Encrypt)
  community.docker.docker_container:
    name: todo-caddy
    image: "{{ caddy_image }}:{{ caddy_tag }}"
    state: started
    restart_policy: always
    restart: "{{ caddy_conf.changed }}"
    published_ports:
      - "{{ app_http_port }}:80"
      - "{{ caddy_https_port }}:443"
    networks:
      - name: "{{ app_network }}"
    volumes:
      - "{{ caddy_config_dir }}/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "{{ caddy_data_volume }}:/data"

- name: Verificar que o Caddy redireciona HTTP para HTTPS
  ansible.builtin.uri:
    url: "http://localhost/"
    status_code: [301, 308]
    follow_redirects: none
  register: app_redirect_check
  retries: 10
  delay: 6
  until: app_redirect_check.status in [301, 308]

- name: Verificar o site em HTTPS ({{ caddy_domain }})
  ansible.builtin.uri:
    url: "https://{{ caddy_domain }}/"
    status_code: 200
  register: app_site_check
  retries: 20
  delay: 10
  until: app_site_check.status == 200

- name: Verificar a API em HTTPS (/todos) com acesso ao MongoDB
  ansible.builtin.uri:
    url: "https://{{ caddy_domain }}/todos"
    status_code: 200
  register: app_api_check
  retries: 10
  delay: 6
  until: app_api_check.status == 200