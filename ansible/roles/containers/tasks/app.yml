---
# Contêineres da VM da aplicação (card 17)
# - todo-backend : API Node.js/Express (porta 5000 só na rede interna do Docker)
# - todo-frontend: Nginx servindo o React na porta 80 e encaminhando /todos para a API

- name: Validar que a senha do banco foi informada pela pipeline
  ansible.builtin.assert:
    that: mongo_app_password | length > 0
    fail_msg: "MONGO_APP_PASSWORD não informada. Configure o GitHub Secret e passe para o Ansible."
    quiet: true

- name: Criar diretório de configuração da aplicação
  ansible.builtin.file:
    path: "{{ app_config_dir }}"
    state: directory
    mode: "0755"

- name: Gerar configuração do Nginx (proxy reverso /todos -> API)
  ansible.builtin.template:
    src: nginx-todo.conf.j2
    dest: "{{ app_config_dir }}/nginx.conf"
    mode: "0644"
  register: app_nginx_conf

- name: Criar rede Docker interna da aplicação
  community.docker.docker_network:
    name: "{{ app_network }}"

- name: Autenticar no registry de imagens (GitHub Container Registry)
  community.docker.docker_login:
    registry_url: "{{ registry_url }}"
    username: "{{ registry_username }}"
    password: "{{ registry_password }}"
  when: registry_password | length > 0
  no_log: true

- name: Baixar imagens da aplicação (tag {{ docker_tag }})
  community.docker.docker_image_pull:
    name: "{{ item }}"
    tag: "{{ docker_tag }}"
    pull: "{{ 'always' if force_pull | bool else 'not_present' }}"
  loop:
    - "{{ app_backend_image }}"
    - "{{ app_frontend_image }}"

- name: Criar/atualizar contêiner da API (todo-backend)
  community.docker.docker_container:
    name: todo-backend
    image: "{{ app_backend_image }}:{{ docker_tag }}"
    state: started
    restart_policy: always
    networks:
      - name: "{{ app_network }}"
    env:
      MONGO_URI: "{{ mongo_uri }}"
  no_log: true          # MONGO_URI contém a senha do banco: não exibir no log da pipeline

- name: Criar/atualizar contêiner do frontend + Nginx (todo-frontend)
  community.docker.docker_container:
    name: todo-frontend
    image: "{{ app_frontend_image }}:{{ docker_tag }}"
    state: started
    restart_policy: always
    restart: "{{ app_nginx_conf.changed }}"     # reinicia só se a configuração do Nginx mudou
    published_ports:
      - "{{ app_http_port }}:80"
    networks:
      - name: "{{ app_network }}"
    volumes:
      - "{{ app_config_dir }}/nginx.conf:/etc/nginx/conf.d/default.conf:ro"

- name: Verificar se o site responde na porta {{ app_http_port }}
  ansible.builtin.uri:
    url: "http://localhost:{{ app_http_port }}/"
    status_code: 200
  register: app_site_check
  retries: 10
  delay: 6
  until: app_site_check.status == 200

- name: Verificar se a API responde e acessa o banco (/todos)
  ansible.builtin.uri:
    url: "http://localhost:{{ app_http_port }}/todos"
    status_code: 200
  register: app_api_check
  retries: 10
  delay: 6
  until: app_api_check.status == 200